[project]
name = "onibus-backend"
version = "0.1.0"
description = "Backend da plataforma de auditoria dos ônibus de São Paulo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "geoalchemy2",
    "httpx",
    "tenacity",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "httpx",
    "testcontainers[postgres]",
    "ruff",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onibus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# O APScheduler 3.x e o asyncpg não trazem tipos nem py.typed.
module = ["apscheduler.*", "asyncpg.*"]
ignore_missing_imports = true
