# Alembic: migrações do banco. Convenções e checklist do revisor em
# db/migrations/README.md. A conexão vem do .env (veja db/migrations/env.py).

[alembic]
script_location = %(here)s/db/migrations
path_separator = os

# 0001_cria_extensoes_schemas_e_funcoes.py: id sequencial de 4 dígitos + mensagem.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Arquivo novo já sai com os imports ordenados e formatado pelo Ruff do uv.lock.
hooks = ruff_imports, ruff_format
ruff_imports.type = module
ruff_imports.module = ruff
ruff_imports.options = check --fix --select I REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
