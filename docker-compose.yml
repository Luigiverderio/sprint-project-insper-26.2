# Ambiente local do backend: banco, API e worker. Suba com `make up`.
# Valores vêm do .env (copie de .env.example).
# Sem bind mounts: o código e os scripts do banco entram nas imagens, e `make up`
# reconstrói o que mudou. Assim ninguém precisa liberar pastas no File Sharing
# do Docker Desktop.
name: onibus

x-app: &app
  build: .
  image: onibus-backend:dev
  env_file:
    - path: .env
      required: false

services:
  db:
    build: ./db
    image: onibus-db:dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onibus}
      POSTGRES_USER: ${POSTGRES_USER:-onibus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      DB_WRITER_PASSWORD: ${DB_WRITER_PASSWORD:?defina DB_WRITER_PASSWORD no .env}
      DB_READER_PASSWORD: ${DB_READER_PASSWORD:?defina DB_READER_PASSWORD no .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 força TCP. Enquanto os scripts de db/init/ rodam, o Postgres
      # só aceita socket local; assim o banco só fica saudável depois deles.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "onibus.processamento"]

volumes:
  dados_banco:
