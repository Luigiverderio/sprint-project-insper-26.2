# Ambiente local do backend: banco, API e worker. Suba com `make up`.
# Valores vêm do .env (copie de .env.example). A senha do banco não tem valor padrão.
# Sem bind mounts: código e esquema entram nas imagens, e `make up` reconstrói o que
# mudou. Assim ninguém precisa liberar pastas no File Sharing do Docker Desktop.
name: onibus

x-app: &app
  build: .
  image: onibus-backend:dev
  env_file:
    - path: .env
      required: false

services:
  # Postgres 16 + PostGIS + pg_partman, sem esquema: as tabelas vêm das migrações
  # (`make migrate`). A manutenção das partições roda a cada hora, dentro do
  # próprio Postgres (pg_partman_bgw), que precisa do usuário postgres.
  db:
    build: ./db
    image: onibus-db:16
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.dbname=${POSTGRES_DB:-onibus}
      - -c
      - pg_partman_bgw.role=postgres
      - -c
      - pg_partman_bgw.interval=3600
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onibus}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: durante a criação o servidor temporário só aceita socket.
      # Testar por TCP evita marcar "saudável" antes de a inicialização terminar.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "onibus.processamento"]

volumes:
  dados_postgres:
